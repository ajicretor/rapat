<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absen Rapat Pimpinan Cabang GP Ansor Kabupaten Bogor</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f0f6f2;--card:#fff;--tx:#0f2a1c;--mut:#587063;--bd:#d3e5da;--ac:#0b6b3a;--g:linear-gradient(135deg,#0a5c32,#13894b);--lime:#f2c230;--limetx:#231c04;--bad:#c01048;--ok:#067647;--soft:#e4f1e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#07130c;--card:#0f2118;--tx:#eaf5ee;--mut:#9bb4a5;--bd:#1d3a2a;--ac:#4ade80;--g:linear-gradient(135deg,#0a5c32,#117a42);--bad:#fb7185;--ok:#47cd89;--soft:#15301f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#07130c;--card:#0f2118;--tx:#eaf5ee;--mut:#9bb4a5;--bd:#1d3a2a;--ac:#4ade80;--g:linear-gradient(135deg,#0a5c32,#117a42);--bad:#fb7185;--ok:#47cd89;--soft:#15301f}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:14px/1.55 "Poppins",system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:26px;font-weight:800;margin:0 0 2px;letter-spacing:-.5px}h2{font-size:20px;font-weight:800;margin:0 0 6px}h3{font-size:15px;font-weight:700;margin:0 0 8px}
.mut{color:var(--mut);font-size:13px}
.brand small{display:block;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.3px;margin-top:2px}
.hero{border-bottom:5px solid var(--lime)}
.brand{display:flex;align-items:center;gap:12px}.lg{width:78px;height:auto;filter:drop-shadow(0 3px 6px rgba(11,107,58,.35))}
.app.adm .brand{border-bottom:1px solid var(--bd);margin-bottom:10px;padding-bottom:18px}
.bt{font-weight:500;text-transform:uppercase;line-height:1.25;white-space:nowrap}
.bt span{display:block;font-size:10px;letter-spacing:2px;color:var(--mut)}
.bt em{display:block;font-style:normal;font-size:20px;line-height:1.1;font-weight:500;letter-spacing:.5px;color:var(--tx);text-transform:uppercase;margin:2px 0}
.bt small{display:inline-block;margin-top:7px;font-size:10px;font-weight:500;letter-spacing:2.5px;background:var(--lime);color:var(--limetx);padding:2px 10px;border-radius:999px}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}@media(max-width:899px){.c2{grid-template-columns:1fr}}
svg.ch{width:100%;height:auto;display:block}
input[type=checkbox]{width:auto;margin:0;accent-color:var(--ac)}
label.ck{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--tx);margin:6px 0;letter-spacing:0}
.hbar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;margin:8px 0;font-size:13px}.trk{background:var(--soft);border-radius:99px;height:12px;overflow:hidden}.trk i{display:block;height:100%;background:var(--g);border-radius:99px}.hbar b{text-align:right}
.feed{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bd)}
.lv{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e11d48;animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.25}}
.hb{position:absolute;right:16px;top:16px;width:56px;height:56px;background:#fff;border-radius:50%;display:grid;place-items:center;z-index:1}.hb img{width:38px}.hero h2{padding-right:60px}
.hb2{width:78px;height:78px;margin:0 auto 10px;background:#fff;border-radius:50%;display:grid;place-items:center}.hb2 img{width:52px}
.app.adm{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
#nav{padding:18px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:18px;padding:4px 10px 16px;letter-spacing:-.3px}.brand i{font-style:normal;background:var(--lime);color:var(--limetx);border-radius:8px;padding:2px 7px;margin-right:6px}
#nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:12px;font-weight:700;color:var(--mut)}
#nav button.on{background:var(--g);color:#fff}
.app.adm #view{padding:28px 32px;max-width:1100px;width:100%}
.app.mob #view{max-width:440px;margin:0 auto;padding:14px 16px 28px}
.app.mob .brand{max-width:440px;margin:0 auto;padding:16px 16px 4px}
#view.phone{max-width:420px;margin:0 auto;padding:18px;border:1px solid var(--bd);border-radius:28px;background:var(--bg);margin-top:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px}
.hero{background:var(--g);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.15)}
.hero p{margin:0;opacity:.9}
.chip{display:inline-block;background:var(--lime);color:var(--limetx);font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.chip.off{background:rgba(255,255,255,.25);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;font-weight:700;color:var(--mut)}
.stat span{display:block;font-size:34px;font-weight:800;color:var(--tx);line-height:1.1}
.stat.hot{background:var(--lime);border-color:var(--lime);color:var(--limetx)}.stat.hot span{color:var(--limetx)}
.cols{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:899px){.app.adm{display:block}#nav{flex-direction:row;overflow-x:auto;height:auto;position:static;padding:10px;border-right:0;border-bottom:1px solid var(--bd)}.brand{display:none}.app.adm #view{padding:16px}.cols{grid-template-columns:minmax(0,1fr)}#nav button{white-space:nowrap}}

/* ---- Menu hamburger (mobile) ---- */
.mbar,.ov{display:none}.mi{display:contents}
@media(max-width:899px){
#nav{position:sticky;top:0;z-index:50;flex-direction:row;align-items:center;overflow:visible;height:auto;padding:8px 14px;border-right:0;border-bottom:1px solid var(--bd)}
.mbar{display:flex;align-items:center;gap:12px;width:100%}
.mbar b{flex:1;font-size:16px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar img{width:34px;height:auto}
#nav .hb{all:unset;cursor:pointer;box-sizing:border-box;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
#nav .hb span{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--tx);transition:transform .25s,opacity .2s}
#nav.open .hb span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
#nav.open .hb span:nth-child(2){opacity:0}
#nav.open .hb span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.mi{display:flex;flex-direction:column;gap:6px;position:fixed;top:0;left:0;bottom:0;width:80%;max-width:300px;padding:18px 14px;background:var(--card);border-right:1px solid var(--bd);box-shadow:6px 0 24px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .28s ease;z-index:70;overflow-y:auto}
#nav.open .mi{transform:none}
.mi .brand{display:flex}
.mi button{padding:14px 12px!important;font-size:15px}
.ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#nav.open .ov{opacity:1;pointer-events:auto}
}

/* ---- Notulensi: alur 4 langkah ---- */
.nt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 24px;margin-top:8px;align-items:start}
.nt textarea{min-height:230px}
.stp{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:6px 0 4px}
.stp i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;font-size:12px}
.rbar{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.rbar button.b{margin:0}
button.b.rec{background:#dc2626}
.rdot{display:none;width:10px;height:10px;border-radius:50%;background:#ef4444;animation:rpl 1s infinite}
.rbar b{font-variant-numeric:tabular-nums;color:var(--mut)}
@keyframes rpl{50%{opacity:.25}}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts button.b{margin:0}
.wa{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.wa button.b{margin:0}
.ntw{border-top:1px solid var(--bd);margin-top:18px;padding-top:12px}
@media(max-width:899px){
.nt{grid-template-columns:minmax(0,1fr)}
.nt textarea{min-height:200px}
.rbar button.b{flex:1}
#gb{width:100%;margin:0}
.acts{flex-direction:column-reverse}.acts button.b{width:100%}
.wa button.b{flex:1 1 calc(50% - 8px)}
}
label{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:130px;resize:vertical}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}.g2>div{min-width:0}.g2.st{grid-template-columns:minmax(0,1fr)}
input,select,textarea{min-width:0;max-width:100%}input[type=datetime-local]{font-size:14px;padding:11px 10px}
button.b{background:var(--g);color:#fff;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;margin:2px 4px 2px 0}
button.big{width:100%;padding:16px;font-size:17px;margin:4px 0}
button.s{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
button.d{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
button:disabled{opacity:.5}
.msg{padding:12px;border-radius:14px;margin-top:10px;border:1.5px solid var(--bd)}
.msg.e{color:var(--bad);border-color:var(--bad)}.msg.o{color:var(--ok);border-color:var(--ok)}
.tk{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--ac);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;color:var(--mut)}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
pre{white-space:pre-wrap;font:inherit;margin:8px 0 0;background:var(--soft);padding:12px;border-radius:12px}
a{color:var(--ac);font-weight:700}
.poster{background:var(--g);border-radius:28px;padding:26px;text-align:center;color:#fff;max-width:340px;margin:8px auto 16px}
.poster h2{font-size:24px}#qr{display:inline-block;background:#fff;padding:14px;border-radius:20px;margin-top:10px}
*{font-weight:400!important}
h1,h2,h3,button,th,.chip,.stat span,.bt em{font-weight:500!important}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-';
const mem={};
const ls={get:k=>{let v='';try{v=localStorage.getItem(k)||''}catch(e){}return v||mem[k]||''},set:(k,v)=>{mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
let selD=null,uid=ls.get('uid'),pin=ls.get('pin'),appUrl='',desaMap={},isAdmin=false,tab='',meetings=[],atts=[],cfg={},sel=null,editing=null,armDel=null,selA=null,receipt=null,rec=null,recording=false,pending=false,loaded=false,loadErr='',loginOpen=false,lastSig='';
if(!uid){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);ls.set('uid',uid)}

/* ---------- Penghubung ke server (Apps Script) ---------- */
const errMsg=e=>String((e&&e.message)||e||'Terjadi kesalahan').replace(/^Error:\s*/,'');
const API_URL='https://script.google.com/macros/s/AKfycbxxjTLn6MNwt9VkMknAxk4hxW0Of2aWBizzdxyYpCKlMIuHRBqo3Tsw6nqICvRHfwVJ/exec'; // URL web app Apps Script (berakhiran /exec)
const api=async(fn,...a)=>{
  let r;
  try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})});r=await r.json()}
  catch(e){throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet dan pastikan penerapan Apps Script berakses "Siapa saja".')}
  if(!r||!r.ok)throw new Error((r&&r.error)||'Server tidak merespons.');
  return r.data;
};
const adm=(fn,...a)=>api(fn,pin,...a).catch(e=>{if(/PIN admin salah/.test(errMsg(e)))logout(true);throw e});
async function load(force){
  try{
    const d=await api('getData',uid,pin);
    if(pin&&!d.admin){pin='';ls.set('pin','')}
    const sig=JSON.stringify(d),changed=sig!==lastSig;lastSig=sig;
    isAdmin=!!d.admin;appUrl=location.href.split('#')[0].split('?')[0];desaMap=d.desaMap||{};cfg=d.config||{};atts=d.attendance||[];
    meetings=(d.meetings||[]).slice().sort((a,b)=>(b.start||'').localeCompare(a.start||''));
    loaded=true;loadErr='';
    if(force)render(true);
    else if(changed&&!(isAdmin&&(tab==='rapat'||tab==='qr')))render(); // jangan timpa form yang sedang diisi admin
  }catch(e){if(!loaded){loadErr=errMsg(e);render(true)}}
}
const showLogin=()=>{loginOpen=true;render(true);scrollTo(0,0)};
function logout(expired){menu(0);pin='';ls.set('pin','');isAdmin=false;tab='';loginOpen=!!expired;lastSig='';load(true)}
function vLogin(){
  return `<div class="card"><h2>Masuk admin</h2><p class="mut">Masukkan PIN admin untuk membuka dashboard.</p>
  <label>PIN admin</label><input id="pn" type="password" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="b" id="lb" onclick="doLogin()">Masuk</button><button class="s b" onclick="loginOpen=false;render(true)">Batal</button><div id="st"></div></div>`;
}
async function doLogin(){
  const p=$('#pn').value.trim();if(!p)return msg('Isi PIN dulu ya.','e');
  $('#lb').disabled=true;msg('Memeriksa PIN…');
  try{
    const d=await api('getData',uid,p);
    if(!d.admin){$('#lb').disabled=false;return msg('PIN salah.','e')}
    pin=p;ls.set('pin',p);loginOpen=false;tab='home';lastSig='';await load(true);
  }catch(e){const b=$('#lb');if(b)b.disabled=false;msg('Gagal: '+esc(errMsg(e)),'e')}
}

function render(f){
  const a=document.activeElement;
  if(!f&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pending=true;return}
  pending=false;
  if(!isAdmin)tab='absen';else if(!tab)tab='home';
  $('#app').className='app '+(isAdmin?'adm':'mob');
  const T=[['home','🏠 Dashboard'],['rapat','📅 Agenda rapat'],['hadir','✅ Kehadiran'],['qr','🔳 QR Code'],['absen','📱 Tampilan peserta']];
  const BR=`<div class="brand"><img class="lg" src="${LOGO}" alt="GP Ansor"><div class="bt"><span>pimpinan cabang</span><em>GP Ansor</em><span>kabupaten bogor</span><small>absen rapat</small></div></div>`;
  const cur=(T.find(t=>t[0]===tab)||T[0])[1].replace(/^\S+\s/,'');
  $('#nav').innerHTML=isAdmin?`<div class="mbar"><button class="hb" aria-label="Buka menu" onclick="menu()"><span></span><span></span><span></span></button><b>${cur}</b><img src="${LOGO}" alt=""></div><div class="mi">${BR}`+T.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+`<button onclick="logout()">🚪 Keluar admin</button></div><div class="ov" onclick="menu(0)"></div>`:BR;
  $('#nav').style.cssText=isAdmin?'':'background:none;border:0;height:auto;position:static;padding:0'
  const v=$('#view');v.className=isAdmin&&tab==='absen'?'phone':'';
  if(!loaded)v.innerHTML=loadErr?`<div class="card">${esc(loadErr)}<br><br><button class="b" onclick="loadErr='';load(true)">Coba lagi</button></div>`:'<p class="mut">Memuat…</p>';
  else v.innerHTML=(loginOpen&&!isAdmin)?vLogin():{home:vHome,absen:vAbsen,rapat:vRapat,hadir:vHadir,qr:vQR}[tab]();
  if(loaded&&!(loginOpen&&!isAdmin)){if(tab==='qr')drawQR();if(tab==='absen')tgl()}
}
const liveList=()=>{const n=Date.now();return meetings.filter(m=>m.start&&m.end&&n>=new Date(m.start)-18e5&&n<=+new Date(m.end))};

document.addEventListener('focusout',()=>setTimeout(()=>{if(pending)render()},250));
const menu=o=>{const n=$('#nav');const open=o===undefined?!n.classList.contains('open'):!!o;n.classList.toggle('open',open);document.body.style.overflow=open?'hidden':''};
addEventListener('keydown',e=>{if(e.key==='Escape')menu(0)});addEventListener('resize',()=>{if(innerWidth>=900)menu(0)});
const go=t=>{menu(0);tab=t;render(true);scrollTo(0,0)};
const msg=(t,k='')=>{const e=$('#st');if(e)e.innerHTML=t?`<div class="msg ${k}">${t}</div>`:''};

const KEC=['Babakan Madang','Bojonggede','Caringin','Cariu','Ciampea','Ciawi','Cibinong','Cibungbulang','Cigombong','Cigudeg','Cijeruk','Cileungsi','Ciomas','Cisarua','Ciseeng','Citeureup','Dramaga','Gunung Putri','Gunung Sindur','Jasinga','Jonggol','Kemang','Klapanunggal','Leuwiliang','Leuwisadeng','Megamendung','Nanggung','Pamijahan','Parung','Parung Panjang','Rancabungur','Rumpin','Sukajaya','Sukamakmur','Sukaraja','Tajurhalang','Tamansari','Tanjungsari','Tenjo','Tenjolaya'];
const asal=a=>a.tingkat&&a.tingkat!=='PC'?a.tingkat+' '+(a.kecamatan||'')+(a.desa?' · '+a.desa:''):(a.tingkat||'-');
function asalForm(){
  const L=liveList(),pac=L.some(m=>m.invPAC),rt=L.some(m=>m.invRanting);
  if(!pac&&!rt)return '';
  const t=ls.get('tk'),kc=ls.get('kc');
  const o=[['PC','PC (Pengurus Cabang)']].concat(pac?[['PAC','PAC (tingkat kecamatan)']]:[],rt?[['Ranting','Ranting (tingkat desa)']]:[]);
  return `<label>Tingkat</label><select id="tk" onchange="tgl()">${o.map(x=>`<option value="${x[0]}" ${x[0]===t?'selected':''}>${x[1]}</option>`).join('')}</select>
  <div id="kcw"><label>Kecamatan</label><select id="kc" onchange="tgl()"><option value="">Pilih kecamatan</option>${KEC.map(k=>`<option ${k===kc?'selected':''}>${k}</option>`).join('')}</select></div>
  <div id="dsw"><label>Desa / Kelurahan</label><input id="ds" list="dsl" value="${esc(ls.get('ds'))}" placeholder="Nama desa"><datalist id="dsl"></datalist></div>`;
}
function tgl(){
  const t=$('#tk');if(!t)return;const k=$('#kc'),v=t.value;
  $('#kcw').style.display=v==='PC'?'none':'';$('#dsw').style.display=v==='Ranting'?'':'none';

const tm=d=>new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const bar=(d,h=150)=>{const W=340,mx=Math.max(1,...d.map(x=>x.v)),bw=W/Math.max(d.length,1),base=h+8;return `<svg class="ch" viewBox="0 0 ${W} ${h+34}">`+d.map((x,i)=>{const bh=x.v/mx*(h-14),X=i*bw+bw*.18,cx=X+bw*.32;return `<g><title>${esc(x.t||x.l)}: ${x.v}</title><rect x="${X}" y="${base-bh}" width="${bw*.64}" height="${bh}" rx="5" fill="var(--ac)"/><text x="${cx}" y="${base-bh-4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tx)">${x.v}</text><text x="${cx}" y="${h+24}" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(x.l)}</text></g>`}).join('')+'</svg>'};
const hbars=d=>{const mx=Math.max(1,...d.map(x=>x.v));return d.map(x=>`<div class="hbar"><span>${esc(x.l)}</span><div class="trk"><i style="width:${x.v/mx*100}%"></i></div><b>${x.v}</b></div>`).join('')||'<p class="mut">Belum ada data.</p>'};
function mapSvg(m,L){
  const P=L.filter(a=>a.lat!=null);
  if(!P.length)return '<p class="mut">Belum ada titik lokasi untuk rapat ini.</p>';
  const has=m.lat!=null,la0=has?m.lat:P.reduce((t,a)=>t+a.lat,0)/P.length,lo0=has?m.lng:P.reduce((t,a)=>t+a.lng,0)/P.length;
  const pts=P.map(a=>({a,x:(a.lng-lo0)*111320*Math.cos(la0*Math.PI/180),y:(a.lat-la0)*110540}));
  const rad=m.radius||150,R=Math.max(has?rad:0,30,...pts.map(q=>Math.hypot(q.x,q.y)))*1.15,k=170/R;
  let g=`<svg class="ch" viewBox="0 0 400 400"><rect width="400" height="400" rx="18" fill="var(--soft)"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="var(--bd)" stroke-width="2"/><circle cx="200" cy="200" r="85" fill="none" stroke="var(--bd)" stroke-dasharray="3 5"/>
  <line x1="200" y1="30" x2="200" y2="370" stroke="var(--bd)"/><line x1="30" y1="200" x2="370" y2="200" stroke="var(--bd)"/>
  <text x="200" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="var(--mut)">U</text>
  <text x="372" y="193" text-anchor="end" font-size="10" fill="var(--mut)">${Math.round(R)} m</text>`;
  if(has)g+=`<circle cx="200" cy="200" r="${rad*k}" fill="var(--ok)" fill-opacity=".1" stroke="var(--ok)" stroke-width="2" stroke-dasharray="6 4"/><circle cx="200" cy="200" r="8" fill="var(--lime)" stroke="var(--tx)" stroke-width="2"/><text x="200" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tx)">Lokasi rapat</text>`;
  pts.forEach(q=>{const d=has?Math.hypot(q.x,q.y):0,ok=!has||d<=rad;g+=`<a href="https://www.google.com/maps?q=${q.a.lat},${q.a.lng}" target="_blank"><circle cx="${200+q.x*k}" cy="${200-q.y*k}" r="7" fill="${ok?'var(--ac)':'var(--bad)'}" stroke="#fff" stroke-width="2"><title>${esc(q.a.name)}${q.a.jabatan?' ('+esc(q.a.jabatan)+')':''} · ${tm(q.a.ts)}${has?' · '+Math.round(d)+' m':''}</title></circle></a>`});
  return g+`</svg><p class="mut">${P.length} dari ${L.length} peserta punya titik lokasi. Titik hijau di dalam radius valid, merah di luar. Ketuk titik untuk membuka Google Maps. Peta ini berskala meter tanpa gambar peta dasar.</p>`;
}

let recT=0,recI=null;

function recUI(on){

function toggleRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return msg('Browser ini tidak mendukung rekam suara. Pakai Chrome, atau tempel transkrip manual.','e');
  if(recording){recording=false;rec.stop();recUI(false);return msg('Rekaman dihentikan.','o')}
  rec=new SR();rec.lang='id-ID';rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{const t=$('#tr');if(!t)return;for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t.value+=(t.value&&!/\s$/.test(t.value)?' ':'')+e.results[i][0].transcript};
  rec.onend=()=>{if(recording)try{rec.start()}catch(e){}};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){recording=false;recUI(false);msg('Akses mikrofon ditolak.','e')}};
  try{rec.start();recording=true;recT=0;recUI(true);msg('Sedang merekam…')}catch(e){msg('Gagal memulai rekam.','e')}

const waList=id=>{const l=atts.filter(a=>a.meetingId===id&&a.phone);return `<div class="stp"><i>💬</i><span>Kirim lewat WhatsApp (${l.length} peserta punya nomor)</span></div><div class="wa">`+(l.map(a=>`<button class="s b" onclick="waSend('${a.id}')">💬 ${esc(a.name)}</button>`).join('')||'<span class="mut">Belum ada peserta yang mengisi nomor WhatsApp.</span>')+'</div>'};
function waSend(id){
  const a=atts.find(x=>x.id===id),m=meetings.find(x=>x.id===sel);if(!a||!m)return;
  let n=String(a.phone||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);
  const t=`Assalamu’alaikum Sahabat ${a.name}, terima kasih telah hadir di ${m.title} (${fmt(m.start)}).\n\nNOTULENSI\n${$('#sm').value}\n\nWassalamu’alaikum,\nPimpinan Cabang Gerakan Pemuda Ansor Kabupaten Bogor`;
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t),'_blank');
}

/* ---------- Kehadiran ---------- */
function vHadir(){
  if(!selA||!meetings.some(m=>m.id===selA))selA=meetings[0]&&meetings[0].id;
  const list=atts.filter(a=>a.meetingId===selA).sort((a,b)=>a.ts.localeCompare(b.ts));
  return `<h1>Kehadiran</h1><p class="mut">Daftar hadir lengkap dengan waktu dan titik lokasi.</p><br>
  <div class="card"><label>Pilih rapat</label><select onchange="selA=this.value;render(true)">${meetings.map(m=>`<option value="${m.id}" ${m.id===selA?'selected':''}>${esc(m.title)} (${fmt(m.start)})</option>`).join('')}</select>
  <div class="row"><b>${list.length} peserta hadir</b>${list.length?'<button class="b s" onclick="csv()">⬇ Unduh CSV</button>':''}</div>
  <div class="wrap"><table><tr><th>#</th><th>Nama</th><th>Jabatan</th><th>Asal</th><th>Waktu</th><th>Lokasi</th><th>Jarak</th></tr>${list.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.name)}</td><td>${esc(a.jabatan||'-')}</td><td>${esc(asal(a))}</td><td>${fmt(a.ts)}</td><td>${a.lat!=null?`<a href="https://www.google.com/maps?q=${a.lat},${a.lng}" target="_blank" rel="noopener">Peta</a>`:'-'}</td><td>${a.dist!=null?a.dist+' m':'-'}</td></tr>`).join('')}</table></div></div>`;
}
function csv(){
  const m=meetings.find(x=>x.id===selA);if(!m)return;
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Rapat','Nama','Jabatan','Tingkat','Kecamatan','Desa','Waktu','Lat','Lng']].concat(atts.filter(a=>a.meetingId===selA).sort((a,b)=>a.ts.localeCompare(b.ts)).map(a=>[m.title,a.name,a.jabatan,a.tingkat,a.kecamatan,a.desa,a.ts,a.lat,a.lng]));
  try{
    const u=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a');a.href=u;a.download='kehadiran.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
  }catch(e){alert('Browser tidak mengizinkan unduhan di tampilan ini.')}
}

/* ---------- QR ---------- */
function vQR(){
  return `<h1>QR Code meja rapat</h1><p class="mut">QR ini tetap, tidak berubah. Judul rapat ditentukan otomatis dari waktu dan lokasi.</p><br>
  <div class="cols"><div class="card"><label>Tautan halaman ini</label><input id="lk" value="${esc(cfg.link||appUrl||'')}" placeholder="https://username.github.io/absen/" onchange="saveLink(this.value)"><p class="mut">Terisi otomatis dari alamat halaman ini. Ubah hanya jika memakai tautan pendek sendiri, lalu cetak atau screenshot QR di samping.</p><div id="st"></div></div>
  <div class="poster"><div class="hb2"><img src="${LOGO}" alt=""></div><h2>Scan untuk absen</h2><p style="margin:0;opacity:.9">Rapat Pimpinan Cabang Gerakan Pemuda Ansor Kabupaten Bogor</p><div id="qr"></div></div></div>`;
}
function drawQR(){
  const e=$('#qr');if(!e)return;e.innerHTML='';
  if(!(cfg.link||appUrl)||typeof QRCode==='undefined'){e.style.display='none';return}
  e.style.display='inline-block';new QRCode(e,{text:(cfg.link||appUrl).split('#')[0],width:220,height:220});
}
async function saveLink(v){cfg.link=v.trim();try{await adm('saveConfig',cfg.link)}catch(e){msg('Gagal menyimpan tautan.','e')}render(true)}

/* ---------- Init ---------- */
load(true);
setInterval(()=>{if(!document.hidden&&isAdmin)load(false)},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false)});
render(true);
</script>
</body>
</html>
